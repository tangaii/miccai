[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medical-image-parsing"
version = "0.1.0"
description = "R3-MedGemma research code for heterogeneous medical image parsing with task-specific prediction branches."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "Pillow>=10,<13",
  "PyYAML>=6,<7",
  "scipy>=1.11,<2",
  "scikit-learn>=1.3,<2",
  "joblib>=1.1,<2",
  "torch>=2.1,<3",
  "transformers>=4.45,<6",
  "peft>=0.10,<1",
  "accelerate>=0.30,<2",
  "safetensors>=0.4,<1",
  "catboost>=1.2,<2",
]

[project.optional-dependencies]
dev = ["pytest>=7.2,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
